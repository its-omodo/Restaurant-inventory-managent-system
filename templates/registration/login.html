<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Starlight Restaurant</title><style>body{margin:0;background:linear-gradient(135deg,#f9f4ea 0%,#f1ebff 100%);font-family:system-ui,-apple-system,sans-serif;color:#1a102d;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 36px));background:#fffdfb;border:1px solid #e8ddc4;border-radius:14px;padding:30px;box-shadow:0 16px 40px rgba(26,16,45,0.12)}h1{margin:0 0 6px;color:#1a102d}.muted{color:#665678;margin-bottom:24px}label{display:block;font-weight:650;margin:14px 0 7px;color:#1a102d}input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #d9caad;border-radius:8px;font:inherit;background:#fff}.btn{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:linear-gradient(135deg,#d4a94f,#b6801d);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(182,128,29,0.2)}</style></head><body><form class="box" method="post">{% csrf_token %}<h1>Starlight Restaurant</h1><div class="muted">Sign in to continue to your dashboard.</div>{% if form.errors %}<div style="color:#b64545;margin-bottom:10px">Invalid username or password.</div>{% endif %}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<input type="hidden" name="next" value="/"><button class="btn" type="submit">Sign in</button></form></body></html>
